name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.3
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.3
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Decode keystore
      run: |
        echo "${{ secrets.OTF_JKS_BASE64 }}" | base64 -d > otf.jks

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: gradle assembleRelease --no-daemon --stacktrace

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk ZaralynSettings-v${{ github.run_number }}.apk

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: 修复新版兼容性问题
        body: |
          ## 修复新版兼容性问题

          本版本修复了 ZaralynSettings 对**新版家长管理（v6.2.8+）**不兼容的问题，并自动适配新旧版本。

          ### 兼容性修复内容

          - **自动识别版本**：启动时通过数据库结构自动检测家长管理为老版（forbidden_app / un_mall_app_state 机制）还是新版（install_app_list.disabled_state 机制），无需手动切换
          - **全局安装开关**：新版下同步写入新管控表 install_app_list 与旧门禁表，确保开关生效
          - **黑名单/白名单**：新版自动读写 install_app_list（disabled_state），老版仍走 forbidden_app
          - **家长密码读取**：兼容明文与加密（AES）存储的密码
          - **数据库管理**：新版 mysql.db3 只读提示；新增「设置」页

          ### 新增设置页

          - **家长管理版本**：显示检测结果，可手动重新检测
          - **SQL 修改方式**（全局生效）：自动 / raw_sql 注入 / 标准 ContentProvider，三种方式自动适配不同环境

          ### 安装说明

          1. 下载 APK 文件
          2. 在设备上安装
          3. 授予必要权限
          4. 在「设置」页可查看检测到的家长管理版本并调整 SQL 方式

          ### 签名信息

          - 签名文件: otf.jks
          - 签名别名: OTFiles

          ### 注意

          - 数据库管理页 SQLiteProvider（mysql.db3）在新版中为只读，仅能查询
        files: ZaralynSettings-v${{ github.run_number }}.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}